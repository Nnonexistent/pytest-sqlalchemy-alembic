[project]
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = [
  "pytest>=8.4.0",
  "pytest-sqlalchemy-alembic",
  "sqlalchemy>=2.0.0",
]
description = "Example project to test pytest-sqlalchemy-alembic plugin"
name = "example-project"
requires-python = ">=3.10"
version = "0.1.0"

[tool.pytest.ini_options]
sqlalchemy_session_maker = "example_project.db:SessionLocal"

[tool.uv.sources]
pytest-sqlalchemy-alembic = {path = "../"}
