[project]
authors = [
  {name = "Nik Sergievskii", email = "nnonexistent@gmail.com"},
  {name = "Kosma", email = "oversider.kosma@gmail.com"},
]
classifiers = [
  "Intended Audience :: Developers",
  "Framework :: Pytest",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "alembic>=1.16",
  "pytest>=8.4",
  "sqlalchemy>=2.0",
]
description = "Pytest plugin to manage databases, sessions and migrations for sqlalchemy-based projects"
name = "pytest-sqlalchemy-alembic"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.2"

[dependency-groups]
dev = [
  "ipython>=8.39.0",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "ruff>=0.15.15",
  "sqlalchemy[mypy]>=2.0.0",
]

[project.entry-points.pytest11]
sqlalchemy-alembic = "pytest_sqlalchemy_alembic.plugin"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.18,<0.12"]

[tool.pytest.ini_options]
addopts = "--disable-plugin-autoload"
filterwarnings = ["error"]
testpaths = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "D",
  "D404",
  "E",
  "EM",
  "ERA",
  "EXE",
  "FA",
  "FBT",
  "FLY",
  "FAST",
  "YTT",
  "G",
  "INP",
  "ICN",
  "ISC",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PYI",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TID251",
  "TD",
  "TRY",
  "UP",
  "W",
]
ignore = ["B011", "B027", "D1", "E731", "ISC001", "PLR0913", "PT015", "RET505", "S101", "S311", "SIM108", "SIM118", "TD002", "FBT001", "PLC0415", "UP032"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
sqlalchemy = "sa"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
check_untyped_defs = true
exclude = ["example_project_async/", "example_project/"]
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
