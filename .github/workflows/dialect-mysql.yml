name: "MySQL dialect tests"

on:
  workflow_call:

jobs:
  dialect-mysql-tests:
    name: Dialect tests (MySQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mysql_version: ["8.0", "8.4", "9.7"]
        drivername:
          - "mysql+mysqldb"
          - "mysql+pymysql"
          - "mysql+mysqlconnector"
          - "mysql+cymysql"
          - "mysql+asyncmy"
          - "mysql+aiomysql"

        include:
          - drivername: "mysql+mysqldb"
            project_directory: example_project
          - drivername: "mysql+pymysql"
            project_directory: example_project
          - drivername: "mysql+mysqlconnector"
            project_directory: example_project
          - drivername: "mysql+cymysql"
            project_directory: example_project
          - drivername: "mysql+asyncmy"
            project_directory: example_project_async
          - drivername: "mysql+aiomysql"
            project_directory: example_project_async

    services:
      mysql:
        image: mysql:${{ matrix.mysql_version }}
        env:
          MYSQL_DATABASE: example
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306

    env:
      UV_PYTHON: ${{ matrix.python_version }}
      DATABASE_URL: ${{ matrix.drivername }}://root:password@127.0.0.1:3306/example

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: mysql-${{ matrix.python_version }}

      - name: Install pre-requisite packages
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - name: Run example project tests
        working-directory: ${{ matrix.project_directory }}
        run: uv run --extra mysql pytest
