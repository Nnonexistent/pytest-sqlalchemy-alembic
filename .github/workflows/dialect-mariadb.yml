name: "MariaDB dialect tests"

on:
  workflow_call:

jobs:
  dialect-mariadb-tests:
    name: Dialect tests (MariaDB)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mariadb_version: ["10.6", "10.11", "11.8", "12.3"]
        drivername:
          - "mariadb+mysqldb"
          - "mariadb+pymysql"
          - "mariadb+mariadbconnector"
          - "mariadb+cymysql"
          - "mariadb+asyncmy"
          - "mariadb+aiomysql"

        include:
          - drivername: "mariadb+mysqldb"
            project_directory: example_project
          - drivername: "mariadb+pymysql"
            project_directory: example_project
          - drivername: "mariadb+mariadbconnector"
            project_directory: example_project
          - drivername: "mariadb+cymysql"
            project_directory: example_project
          - drivername: "mariadb+asyncmy"
            project_directory: example_project_async
          - drivername: "mariadb+aiomysql"
            project_directory: example_project_async

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb_version }}
        env:
          MARIADB_DATABASE: example
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-start-period 10s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    env:
      UV_PYTHON: ${{ matrix.python_version }}
      DATABASE_URL: ${{ matrix.drivername }}://root:password@127.0.0.1:3306/example

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: mariadb-${{ matrix.python_version }}

      - name: Install pre-requisite packages
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Run example project tests
        working-directory: ${{ matrix.project_directory }}
        run: uv run --extra mariadb pytest
