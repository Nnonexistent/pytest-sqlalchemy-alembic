repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        name: "Ruff lint"
        args: [--fix]

      - id: ruff
        name: "Ruff sort imports"
        args: [--select, I, --fix]

      - id: ruff-format
        name: "Ruff format"

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        args: ["src"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy-example-project
        name: mypy for example_project
        language: system
        entry: bash -c 'cd example_project && exec uv run mypy .' --
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy-example-project-async
        name: mypy for example_project_async
        language: system
        entry: bash -c 'cd example_project_async && exec uv run mypy .' --
        pass_filenames: false
